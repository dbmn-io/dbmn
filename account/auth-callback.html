<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signing In - DBMN</title>
    <meta name="description" content="Completing DBMN sign-in">
    <link rel="icon" type="image/svg+xml" href="/images/dobermannOutline.svg">
    <link rel="icon" type="image/png" href="/images/DBMNLogo.png">
    <link rel="stylesheet" href="/css/brand.css">
    <!-- The theme: the app's themes, worn before the page paints, and the picker (assets/js/site-theme.js) -->
    <link rel="stylesheet" href="/assets/css/theme-picker.css">
    <script src="/assets/js/dbmn-themes.js"></script>
    <script src="/assets/js/site-theme.js"></script>
    <script defer src="/assets/js/theme-picker.js"></script>
    <link rel="stylesheet" href="/account/shared.css">
</head>
<body>
    <header class="site-header">
        <a href="/">
            <img src="/images/DBMNLogo.png" alt="DBMN">
            <h1>DBMN</h1>
        </a>
        <div class="header-right header-theme"><span class="theme-picker-anchor"><button type="button" class="site-theme-btn" data-site-theme hidden></button></span></div>
    </header>

    <div class="container">
        <div class="card">
            <h2 id="callbackTitle">Signing you in...</h2>
            <div id="alert" class="alert"></div>
            <p id="callbackStatus" style="color: var(--brand-text-muted);"><span class="spinner"></span> Verifying your sign-in link</p>
        </div>

{% include site_footer.html %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/account/shared.js"></script>
    <script>
        // A first sign-in by email link: tell DBMN a new account exists, once. The account's
        // email is confirmed by this very click, so "confirmed in the last few minutes" is
        // the first time; the browser flag stops a reload repeating it. Best-effort.
        async function welcomeNewAccount(session) {
            try {
                var confirmedAt = session.user.email_confirmed_at || session.user.confirmed_at;
                if (!confirmedAt || Date.now() - new Date(confirmedAt).getTime() > 5 * 60 * 1000) { return; }
                var flag = 'dbmn-welcomed-' + session.user.id;
                try {
                    if (localStorage.getItem(flag)) { return; }
                    localStorage.setItem(flag, '1');
                } catch (storageErr) { /* no storage: send anyway */ }
                await callEdgeFunction('send-welcome-email', { email: session.user.email });
            } catch (err) {
                console.warn('Welcome email notification failed:', err);
            }
        }

        document.addEventListener('DOMContentLoaded', async function() {
            initSupabase();

            // Supabase JS auto-detects session from the URL hash fragment
            // (the magic link redirect lands here with #access_token=...&refresh_token=...)
            // Give the SDK a tick to process the hash, then check for a session.
            var session = null;
            for (var attempt = 0; attempt < 10; attempt++) {
                session = await getCurrentSession();
                if (session) break;
                await new Promise(function(r) { setTimeout(r, 100); });
            }

            if (!session) {
                document.getElementById('callbackTitle').textContent = 'Sign-in failed';
                document.getElementById('callbackStatus').innerHTML =
                    'Your sign-in link may have expired or been used already. ' +
                    '<a href="/account/login.html">Request a new link</a>.';
                showAlert('alert', 'Could not complete sign-in.', 'error');
                return;
            }

            await welcomeNewAccount(session);

            if (isVSCodeRedirect()) {
                document.getElementById('callbackTitle').textContent = 'Signed in';
                document.getElementById('callbackStatus').textContent = 'Returning to VS Code...';
                // VS Code gets this session; the browser gets one of its own (see shared.js).
                var siteSignedIn = await handOffToVSCode(session);
                if (siteSignedIn) {
                    // After the vscode:// URI fires, leave the user on /account/index.html
                    setTimeout(function() { window.location.href = '/account/index.html'; }, 1500);
                } else {
                    document.getElementById('callbackStatus').textContent = VSCODE_ONLY_MESSAGE;
                }
                return;
            }

            // Back to where sign-in was asked for (e.g. /puppy-school/), same-site paths only.
            window.location.href = getReturnPath();
        });
    </script>
</body>
</html>
