title: DBMN.io
description: Migrate millions of records through any REST API — in your browser or in VS Code.

# The open source repository. PLACEHOLDER until the repository is public:
#   github_repo  the address every page links to (docs pages write it out in full:
#                grep -rn "github.com/dbmn-io/dobermann" to find them all)
#   github_live  false = the landing pages say "on GitHub soon" and link to /open-source/
#                true  = they link straight to github_repo
github_repo: "https://github.com/dbmn-io/dobermann"
github_live: false
url: https://dbmn.io
baseurl: ""

# Theme
remote_theme: just-the-docs/just-the-docs@v0.8.2

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# Color scheme
color_scheme: dbmn

# Logo
logo: "/images/DBMNLogo.png"

# Aux links (top right)
aux_links:
  "Puppy School":
    - "/puppy-school/"
  "Open the app":
    - "https://app.dbmn.io"
  # The desktop app is not downloadable yet (code signing): the link goes to the
  # Installation section, which says so. Point it at the download when there is one.
  "Download (coming soon)":
    - "/docs/#installation"
  "VS Code Marketplace":
    - "https://marketplace.visualstudio.com/items?itemName=dbmn.dobermann"
  "GitHub":
    - "https://github.com/dbmn-io/dobermann"

aux_links_new_tab: true

# Footer
footer_content: "&copy; 2026 DBMN.io. Free and open source (AGPL-3.0). Migrate millions of records through any REST API."

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Search
search_enabled: true
search:
  heading_level: 4
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Blog
permalink: /blog/:year/:month/:title/

# Puppy School — the course. Lessons are markdown in _puppy_school/, rendered by
# _layouts/puppy_school.html at /puppy-school/<slug>/ (landing: /puppy-school/).
# See _puppy_school/README.md for the rendering contract.
collections:
  puppy_school:
    output: true
    permalink: /puppy-school/:slug/

# The oldest Dobermann the course works with. Pages say {dobermann-min-version}
# (_plugins/puppy_school_version.rb). Raise it when a lesson needs something newer.
puppy_school:
  min_dobermann: "0.3.0"

# Navigation defaults
defaults:
  - scope:
      path: ""
      type: puppy_school
    values:
      layout: puppy_school
      # Lesson bodies are full of literal {{template variables}}: Liquid must not touch them.
      render_with_liquid: false
  - scope:
      path: "docs"
    values:
      layout: default
      nav_order: 100
      render_with_liquid: false
  - scope:
      path: "_posts"
    values:
      layout: default

# Exclude from build
exclude:
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - .git
  - CLAUDE.md
  - _puppy_school/README.md
  # Internal production notes — never part of the public site
  - docs/internal
