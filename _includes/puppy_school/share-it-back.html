<section class="ps-widget" data-widget="review" aria-live="polite">
    <div class="ps-widget-prompt" data-copy="review-prompt"></div>
    <div class="ps-widget-signin" data-when="signed-out" hidden></div>
    <div data-when="signed-in" hidden>
        <label class="ps-widget-label" for="ps-review-input">Paste what Copy to Share gave you</label>
        <textarea id="ps-review-input" class="ps-widget-input" rows="9" spellcheck="false" autocomplete="off"
                  placeholder="// Name: My Replenishment Orders&#10;// Method: POST&#10;…"></textarea>
        <div class="ps-action-bar">
            <button type="button" class="btn btn-primary ps-widget-submit" data-copy-label="widgets-submit_share">Review my template</button>
        </div>
        <p class="ps-widget-note">Rules, not a robot: the same checks every time. We keep the result — never what you pasted.</p>
    </div>
    <div class="ps-widget-result" hidden></div>
</section>
